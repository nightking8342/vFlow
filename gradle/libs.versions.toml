[versions]
agp = "9.4.1"
kotlin = "2.3.20"
r8 = "8.13.19"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
navigationFragmentKtx = "2.9.7"
navigationUiKtx = "2.9.7"
scenecore = "1.0.0-alpha13"
materialVersion = "1.13.0"
jetbrainsKotlinJvm = "2.3.20"
foundation = "1.10.6"
opencv = "4.13.0"
navigation3 = "1.1.0"
backdrop = "1.0.6"
reorderable = "3.0.0"
foundationLayout = "1.10.6"
multiplatform-markdown-renderer = "0.45.0"
# fork: 解析器版本覆盖。mikepenz 各版声明的 org.jetbrains:markdown 都偏旧
# （0.39.2→0.7.3、0.42/0.43→0.7.5、0.44/0.45→0.7.9），而 GFM 表格块前必须
# 有空行的限制在 0.7.14 才修好（否则段落/粗体行紧贴表格时整块塌成 PARAGRAPH、
# 管道符原样显示）。所以**即便 renderer 升到 0.45.0 也必须保留这条覆盖**。
jetbrains-markdown = "0.7.14"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUiKtx" }
androidx-scenecore = { group = "androidx.xr.scenecore", name = "scenecore", version.ref = "scenecore" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "materialVersion" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
opencv = { group = "org.opencv", name = "opencv", version.ref = "opencv" }
androidx-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "foundationLayout" }
multiplatform-markdown-renderer-android = { module = "com.mikepenz:multiplatform-markdown-renderer-android", version.ref = "multiplatform-markdown-renderer" }
multiplatform-markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "multiplatform-markdown-renderer" }
multiplatform-markdown-renderer-code = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "multiplatform-markdown-renderer" }
# fork: 显式提升 markdown 解析器（覆盖 mikepenz 的 0.7.3 传递依赖），修 GFM 表格前空行问题
jetbrains-markdown = { module = "org.jetbrains:markdown", version.ref = "jetbrains-markdown" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }
